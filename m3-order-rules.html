<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3 order rules</title>
<style>
:root{--bg:#ffffff;--card:#f5f4ed;--text:#1f1e1d;--muted:#6b6a65;--accent-bg:#e6f1fb;--accent-text:#0c447c;--warn:#854f0b;--border:#d3d1c7}
@media (prefers-color-scheme: dark){:root{--bg:#1f1e1d;--card:#2c2c2a;--text:#f1efe8;--muted:#b4b2a9;--accent-bg:#0c447c;--accent-text:#e6f1fb;--warn:#fac775;--border:#444441}}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
p.intro{color:var(--muted);margin:0 0 20px;font-size:14px}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
select{width:100%;padding:8px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.k{font-size:12px;color:var(--muted)}
.v{font-size:14px;font-weight:500}
.s{font-size:12px;color:var(--muted)}
.big{font-size:22px;font-weight:500}
.res{background:var(--accent-bg)}
.res .k,.res .v,.res .s{color:var(--accent-text)}
.warn{color:var(--warn)!important}
@media (max-width:700px){.flow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>How an M3 order is created</h1>
  <p class="intro">Pick a case type, a "Who will pay" value and a Customer service center to see the resulting order.</p>

  <div class="sel">
    <div>
      <label for="ct">Case type</label>
      <select id="ct">
        <option value="hd">Helpdesk</option>
        <option value="rc" selected>Repair Center</option>
      </select>
    </div>
    <div>
      <label for="wp">Who will pay</label>
      <select id="wp">
        <option value="1F1">Customer</option>
        <option value="1F1">Customer due to misuse</option>
        <option value="1F1">Customer, waiting for invoice</option>
        <option value="1F2" selected>Factory warranty</option>
        <option value="1F3">Extended warranty</option>
        <option value="1F4">Goodwill (free of charge)</option>
        <option value="1F5">Warranty on repair performed</option>
        <option value="1F6">Customer, device already repaired</option>
      </select>
    </div>
    <div>
      <label for="cs">Customer service center</label>
      <select id="cs">
        <option value="eq">France BU Equipement</option>
        <option value="im" selected>France BU Imagerie</option>
        <option value="ib">Acteon Iberica</option>
        <option value="ot">Other CS</option>
      </select>
    </div>
  </div>

  <div class="flow">
    <div class="card">
      <span class="k">1 · Trigger</span>
      <span class="v" id="t-ms"></span>
      <span class="s" id="t-st"></span>
    </div>
    <div class="card">
      <span class="k">2 · Order type</span>
      <span class="v big" id="o-code"></span>
      <span class="s">From "Who will pay"</span>
    </div>
    <div class="card">
      <span class="k">3 · Depot and establishment</span>
      <span class="v" id="d-dep"></span>
      <span class="s" id="d-est"></span>
    </div>
    <div class="card res">
      <span class="k">Order sent to M3</span>
      <span class="v big" id="r-code"></span>
      <span class="s" id="r-sum"></span>
    </div>
  </div>
</main>

<script>
var CS = {
  eq: {dep: "Depot D01", est: "Establishment A00", ok: true},
  im: {dep: "Depot H34", est: "Establishment H00", ok: true},
  ib: {dep: "Depot T33", est: "Establishment to define", ok: false},
  ot: {dep: "Depot to define", est: "Establishment to define", ok: false}
};
var TR = {
  hd: {ms: "Milestone \u201CCommunication\u201D", st: "Closed with status \u201CQuote accepted\u201D"},
  rc: {ms: "Milestone \u201CRepair\u201D", st: "Closed with status \u201CDevice repaired\u201D"}
};
function upd() {
  var ct = document.getElementById("ct").value;
  var code = document.getElementById("wp").value;
  var c = CS[document.getElementById("cs").value];
  document.getElementById("t-ms").textContent = TR[ct].ms;
  document.getElementById("t-st").textContent = TR[ct].st;
  document.getElementById("o-code").textContent = code;
  document.getElementById("d-dep").textContent = c.dep;
  var e = document.getElementById("d-est");
  e.textContent = c.est;
  e.className = c.ok ? "s" : "s warn";
  document.getElementById("r-code").textContent = code;
  document.getElementById("r-sum").textContent = c.dep + " \u00B7 " + c.est;
}
["ct", "wp", "cs"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", upd);
});
upd();
</script>
</body>
</html>
